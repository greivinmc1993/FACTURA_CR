name: QA FacturaCR

on:
  push:
  pull_request:

jobs:
  unit-integration-build:
    name: QA Node 22 + compilación React
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias sin descargar binario Electron
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Cálculos, SQLite temporal, validaciones y sintaxis
        run: npm test
      - name: Compilar React/Vite
        run: npm run build
